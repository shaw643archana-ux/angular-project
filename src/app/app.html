<div class="dashboard">

  <header>
    <h1>🎓 Student Task Dashboard</h1>
    <p>Manage your learning tasks with Angular</p>
  </header>

  <!-- Statistics -->
  <div class="stats">

    <div class="stat-card">
      <span>Total Tasks</span>
      <strong>{{ totalTasks }}</strong>
    </div>

    <div class="stat-card">
      <span>Completed</span>
      <strong class="green">{{ completedTasks }}</strong>
    </div>

    <div class="stat-card">
      <span>Pending</span>
      <strong class="yellow">{{ pendingTasks }}</strong>
    </div>

  </div>

  <!-- Add Task -->
  <section class="add-section">
    <h3>Add New Task</h3>

    <div class="input-row">
      <input
        type="text"
        [(ngModel)]="newTask"
        placeholder="Enter a task..."
        (keyup.enter)="addTask()"
      />

      <button (click)="addTask()">Add Task</button>
    </div>
  </section>

  <!-- Tasks -->
  <section class="tasks-section">
    <h3>My Tasks</h3>

    <div *ngIf="tasks.length === 0" class="empty">
      No tasks added yet.
    </div>

    <div
      class="task"
      *ngFor="let task of tasks; let i = index"
      [class.completed]="task.completed"
    >

      <div class="task-left">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask(i)"
        />

        <span>{{ task.title }}</span>
      </div>

      <button class="delete-btn" (click)="deleteTask(i)">
        Delete
      </button>

    </div>
  </section>

  <!-- Progress -->
  <section class="progress-section">

    <div class="progress-heading">
      <span>Learning Progress</span>
      <span>{{ progress }}%</span>
    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        [style.width.%]="progress">
      </div>
    </div>

  </section>

</div>
