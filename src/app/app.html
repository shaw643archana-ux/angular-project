<div class="container">
  <h1>My Todo List</h1>
  <p class="subtitle">Manage your daily tasks</p>

  <div class="input-section">
    <input 
      type="text" 
      [(ngModel)]="newTodoText" 
      placeholder="Enter a new todo list.."
      (keyup.enter)="addTodo()"
    >
    <button (click)="addTodo()">Add Todo</button>
  </div>

  <div class="card">
    <div class="card-header">
      <span>My Tasks</span>
      <span class="badge">{{ todos.length }} Tasks</span>
    </div>

    <div class="card-body">
      <!-- Jab koi todo na ho -->
      <div *ngIf="todos.length === 0" class="empty-state">
        <p><strong>No todos yet</strong></p>
        <p class="sub-empty">Add a task above to get started.</p>
      </div>

      <!-- Jab todo add ho -->
      <ul *ngIf="todos.length > 0" class="todo-list">
        <li *ngFor="let todo of todos; let i = index">
          <span>{{ todo }}</span>
          <button class="delete-btn" (click)="deleteTodo(i)">✕</button>
        </li>
      </ul>
    </div>
  </div>
</div>
